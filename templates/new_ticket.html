{% extends "base.html" %}
{% block title %}Raise a ticket · HelpDesk Lite{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Raise a ticket</h1>
      <p class="muted">Describe the issue — an agent will pick it up.</p>
    </div>
  </div>

  <form class="form-card" method="POST">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" required placeholder="e.g. Can't access VPN">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="5" placeholder="What's happening, and since when?"></textarea>

    <label for="priority">Priority</label>
    <select id="priority" name="priority" required>
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>

    <div class="form-actions">
      <a class="btn btn--ghost" href="{{ url_for('dashboard') }}">Cancel</a>
      <button class="btn btn--primary" type="submit">Submit ticket</button>
    </div>
  </form>
{% endblock %}
